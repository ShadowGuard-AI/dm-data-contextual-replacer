</g>
<rect x="0" y="100" width="900" height="100" fill="#7a5432"/>
<g fill="#f0e7cb" stroke="#2c2622" stroke-width="2">
<g><rect x="90" y="118" width="34" height="52"/><animateTransform attributeName="transform" type="rotate" values="0 90 170; -16 90 170; 0 90 170" dur="5.5s" repeatCount="indefinite"/></g>
<g><rect x="150" y="118" width="34" height="52"/><animateTransform attributeName="transform" type="rotate" values="0 150 170; -16 150 170; 0 150 170" dur="6.5s" begin="1s" repeatCount="indefinite"/></g>
<g><rect x="210" y="118" width="34" height="52"/><animateTransform attributeName="transform" type="rotate" values="0 210 170; -16 210 170; 0 210 170" dur="7.5s" begin="2s" repeatCount="indefinite"/></g>
</g>
<g fill="none" stroke="#c9a227" stroke-width="3" opacity="0.75"><circle cx="430" cy="168" r="13"/><circle cx="478" cy="168" r="13"/><circle cx="526" cy="168" r="13"/></g>
