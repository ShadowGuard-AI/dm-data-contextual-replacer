<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The collector's cabinet in three bands: an album leaf turning with its ribbon in the back band, index tabs flipping and a roller date stamp trundling and shedding pale rings in the middle band, and a first day cover gliding low on an unseen tray in the front band">
<rect width="900" height="300" fill="#d9cba6"/>
<rect x="0" y="0" width="900" height="100" fill="#e6dcc0"/>
<g>
<rect x="330" y="14" width="240" height="76" fill="#f0e7cb" stroke="#2c2622" stroke-width="2"/>
<g>
<rect x="452" y="14" width="118" height="76" fill="#e0d2a8" stroke="#2c2622" stroke-width="2"/>
<polygon points="500,90 512,90 509,116 506,106 503,116" fill="#a42126"/>
<animateTransform attributeName="transform" type="rotate" values="0 452 52; -14 452 52; 0 452 52" dur="9s" repeatCount="indefinite"/>
</g>
<g fill="#7a5432"><rect x="120" y="22" width="14" height="62"/><rect x="640" y="18" width="14" height="66"/><rect x="770" y="26" width="14" height="58"/></g>
<g><rect x="180" y="30" width="8" height="44" fill="#c9a227"><animate attributeName="y" values="30; 44; 30" dur="7s" repeatCount="indefinite"/></rect></g>
